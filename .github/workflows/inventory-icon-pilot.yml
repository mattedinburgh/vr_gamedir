name: Build 20 inventory icon pilot

on:
  push:
    branches:
      - pilot/inventory-icons-20-2026-09-14
    paths:
      - "Tools/build_inventory_icon_pilot.py"
      - "Data-AIMv53/BigItems/**"
      - ".github/workflows/inventory-icon-pilot.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: inventory-icon-pilot
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pilot branch
        uses: actions/checkout@v4
        with:
          ref: pilot/inventory-icons-20-2026-09-14
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Tools/build_inventory_icon_pilot.py
            Data-AIMv53/BigItems/GUN01.STI
            Data-AIMv53/BigItems/GUN02.STI
            Data-AIMv53/BigItems/GUN03.STI
            Data-AIMv53/BigItems/GUN04.STI
            Data-AIMv53/BigItems/GUN05.STI
            Data-AIMv53/BigItems/GUN06.STI
            Data-AIMv53/BigItems/GUN07.STI
            Data-AIMv53/BigItems/GUN08.STI
            Data-AIMv53/BigItems/GUN09.STI
            Data-AIMv53/BigItems/GUN10.STI
            Data-AIMv53/BigItems/Gun11.sti
            Data-AIMv53/BigItems/GUN110.STI
            Data-AIMv53/BigItems/GUN13.STI
            Data-AIMv53/BigItems/GUN14.STI
            Data-AIMv53/BigItems/GUN15.STI
            Data-AIMv53/BigItems/Gun16.sti
            Data-AIMv53/BigItems/GUN17.STI
            Data-AIMv53/BigItems/GUN18.STI
            Data-AIMv53/BigItems/GUN19.STI
            Data-AIMv53/BigItems/GUN20.STI

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Build and validate 20 STI icons
        run: python Tools/build_inventory_icon_pilot.py --root .

      - name: Commit generated pilot assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse Pilot/InventoryIcons20
          if git diff --cached --quiet; then
            echo "No generated pilot changes."
            exit 0
          fi
          git commit -m "Generate 20 game-ready inventory icon pilot"
          git push origin HEAD:pilot/inventory-icons-20-2026-09-14
