name: Generate Vengeance original music

on:
  push:
    branches: [ master ]
    paths:
      - "Tools/generate_vr_music_gen2.py"
      - ".github/workflows/generate-vr-music.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vengeance-original-music
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            Tools
            Data-Music/Music
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install synthesis dependencies
        run: |
          python -m pip install --disable-pip-version-check numpy scipy
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Generate only missing music slots
        run: python Tools/generate_vr_music_gen2.py

      - name: Commit changed music assets only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             "Data-Music/Music/NOTHING Z10.ogg"             "Data-Music/Music/NOTHING Z11.ogg"             "Data-Music/Music/NOTHING Z12.ogg"             "Data-Music/Music/TENSOR T.ogg"             "Data-Music/Music/BATTLE P.ogg"             "Data-Music/Music/BATTLE Q.ogg"
          if git diff --cached --quiet; then
            echo "No new music assets to commit."
            exit 0
          fi
          git commit -m "Add original Vengeance music cues"
          git push
